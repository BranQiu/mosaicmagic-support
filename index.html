<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魔方马赛克 MosaicMagic — 隐私政策 Privacy Policy</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:#f5f5f7;color:#1d1d1f;line-height:1.7;padding:20px}
.c{max-width:680px;margin:0 auto;background:#fff;border-radius:16px;padding:32px 28px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.langs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid #e5e5e7}
.langs a{display:inline-block;padding:5px 12px;border-radius:8px;font-size:13px;text-decoration:none;color:#0071e3;background:#f0f0f2;transition:all .15s}
.langs a:hover,.langs a.active{background:#0071e3;color:#fff}
h1{font-size:24px;font-weight:700;margin-bottom:6px}
.date{font-size:13px;color:#86868b;margin-bottom:20px}
h2{font-size:17px;font-weight:600;margin:22px 0 8px}
p{font-size:15px;margin:8px 0;color:#424245}
ul{margin:8px 0 8px 20px}
li{font-size:15px;margin:4px 0;color:#424245}
.email{color:#0071e3;text-decoration:none}
.badge{display:inline-block;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:600;margin-left:8px}
.badge.green{background:#e8f5e9;color:#2e7d32}
.footer{text-align:center;font-size:12px;color:#86868b;margin-top:32px;padding-top:16px;border-top:1px solid #e5e5e7}
</style>
</head>
<body>
<div class="c">
<div class="langs" id="langNav"></div>
<div id="content"></div>
<div class="footer">© 2026 Bran Wayne · MosaicMagic</div>
</div>
<script src="policies.js"></script>
<script>
const LANGS={"zh-Hans":"简体中文","zh-Hant":"繁體中文","en":"English","ja":"日本語","ko":"한국어","ar":"العربية","es":"Español","it":"Italiano","fr":"Français","ru":"Русский","de":"Deutsch","da":"Dansk","pt":"Português","nb":"Norsk"};
function detectLang(){const nav=(navigator.language||navigator.userLanguage||'zh').toLowerCase();if(nav.startsWith('zh')){return nav.includes('tw')||nav.includes('hk')||nav.includes('hant')?'zh-Hant':'zh-Hans'}for(const l of Object.keys(LANGS)){if(nav.startsWith(l))return l}return 'en'}
function render(lang){document.querySelectorAll('.langs a').forEach(a=>a.classList.remove('active'));var el=document.querySelector('[data-lang="'+lang+'"]');if(el)el.classList.add('active');document.documentElement.lang=lang;document.getElementById('content').innerHTML=POLICIES[lang]||POLICIES['en'];history.replaceState(null,'','?lang='+lang)}
var nav=document.getElementById('langNav');for(var code in LANGS){var a=document.createElement('a');a.href='#';a.textContent=LANGS[code];a.dataset.lang=code;a.onclick=function(e){e.preventDefault();render(this.dataset.lang)};nav.appendChild(a)}
var params=new URLSearchParams(location.search);var lang=params.get('lang')||detectLang();render(POLICIES[lang]?lang:'en');
</script>
</body>
</html>
